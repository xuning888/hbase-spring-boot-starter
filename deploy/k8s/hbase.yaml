---
# Service: expose HBase ports within the cluster + externally via NodePort
apiVersion: v1
kind: Service
metadata:
  name: hbase
  labels:
    app: hbase
spec:
  type: NodePort
  selector:
    app: hbase
  ports:
    - name: zk
      port: 2181
      targetPort: 2181
      protocol: TCP
    - name: hmaster-rpc
      port: 16000
      targetPort: 16000
      protocol: TCP
    - name: hmaster-webui
      port: 16010
      targetPort: 16010
      protocol: TCP
    - name: rs-rpc
      port: 16201
      targetPort: 16201
      protocol: TCP
    - name: rs-info
      port: 16301
      targetPort: 16301
      protocol: TCP
---
# Deployment: single-replica standalone HBase 1.2
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hbase
  labels:
    app: hbase
spec:
  replicas: 1
  strategy:
    type: Recreate          # HBase can't run 2 instances; always replace
  selector:
    matchLabels:
      app: hbase
  template:
    metadata:
      labels:
        app: hbase
    spec:
      hostname: hbase        # fixed hostname so HBase master registers correctly
      containers:
        - name: hbase
          image: harisekhon/hbase:1.2
          imagePullPolicy: IfNotPresent
          ports:
            - name: zk
              containerPort: 2181
              protocol: TCP
            - name: hmaster-rpc
              containerPort: 16000
              protocol: TCP
            - name: hmaster-webui
              containerPort: 16010
              protocol: TCP
            - name: rs-rpc
              containerPort: 16201
              protocol: TCP
            - name: rs-info
              containerPort: 16301
              protocol: TCP
          env:
            - name: HBASE_ZNODE_FILE
              value: "true"
          volumeMounts:
            - name: hbase-data
              mountPath: /hbase-data
            - name: zk-data
              mountPath: /tmp/hbase-root    # ZK embedded data dir, must survive restarts
          startupProbe:
            tcpSocket:
              port: 16010
            periodSeconds: 10
            failureThreshold: 30            # up to 5 min for first start (image pull + init)
          readinessProbe:
            httpGet:
              path: /master-status
              port: 16010
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 16010
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "2"
      volumes:
        - name: hbase-data
          hostPath:
            path: /data/hbase-data
            type: DirectoryOrCreate
        - name: zk-data
          hostPath:
            path: /data/hbase-zk-data
            type: DirectoryOrCreate
